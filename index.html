oke-linecap="round" fill="none"/></svg><span>Synapti<b>Q</b></span></a><p style="margin-top:14px">Digitálisan jövőálló vezetők, digitálisan jövőálló szervezetek.</p><p><em style="color:inherit;font-style:normal;opacity:.8">From Synapse to Strategy</em></p></div><div><h4>Menü</h4><ul><li><a href="#about">Rólunk</a></li><li><a href="#products">Termékeink</a></li><li><a href="#method">Módszertan</a></li><li><a href="#check">Digitális önteszt</a></li><li><a href="#contact">Kapcsolat</a></li></ul></div><div><h4>Jogi</h4><ul><li><a href="/adatvedelem/" data-legal="privacy" data-close="Bezárás">Adatkezelési tájékoztató</a></li><li><a href="/sutik/" data-legal="cookies" data-close="Bezárás">Süti tájékoztató</a></li><li><a href="mailto:info@synaptiq.hu">info@synaptiq.hu</a></li></ul></div></div><div class="legal-line"><span>© 2026 SynaptiQ Kft. · Minden jog fenntartva.</span><span>Adószám: 32960491-2-42 · Cégjegyzékszám: 01-09-451571</span></div></div></footer><button type="button" class="to-top" aria-label="Vissza az oldal tetejére"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><div class="cookie" role="region" aria-label="Sütik és tárolás" hidden><b>Sütik és tárolás</b><p>Az oldal nem használ követő- vagy hirdetési sütiket. A téma és a nyelv választását a böngésződ helyi tárolójában jegyezzük meg.</p><div class="row"><button type="button" class="btn sm" data-ok>Rendben</button><a class="btn ghost sm" href="/sutik/" data-legal="cookies" data-close="Bezárás">Részletek</a></div></div></template><template id="tpl-en" data-title="SynaptiQ | Digitally future-proof leaders and organisations"><a class="skip" href="#main">Skip to content</a><div class="progress" role="progressbar" aria-label="Reading progress"><i></i></div><header class="site-head"><div class="wrap head-in"><a class="logo" href="#top" aria-label="SynaptiQ"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="19" cy="19" r="9.5"/><path d="M26 26l8 8"/></g><g fill="currentColor"><circle cx="19" cy="19" r="3"/><circle cx="6" cy="9" r="2.2"/><circle cx="35" cy="9" r="2.2"/></g><path d="M7.5 10.2l8.4 6M33.5 10.2l-8.4 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg><span>Synapti<b>Q</b></span></a><nav class="nav" id="nav" aria-label="Main navigation"><a class="nl" href="#about">About</a><a class="nl" href="#products">Our products</a><a class="nl" href="#method">Methodology</a><a class="nl" href="#check">Readiness check</a><a class="nl" href="#contact">Contact</a><a class="btn sm" href="#contact">Let&#x27;s talk</a></nav><div class="tools"><a class="lang" href="/" hreflang="hu" lang="hu" data-lang-switch="hu" aria-label="Language: English. Switch to Hungarian">HU</a><button type="button" class="ibtn theme-btn" aria-pressed="false" data-to-dark="Dark theme" data-to-light="Light theme" aria-label="Switch theme"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button><button type="button" class="ibtn menu-btn" aria-expanded="false" aria-controls="nav" data-open="Open menu" data-close="Close menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></div></header><main id="main" tabindex="-1"><section class="hero" id="top"><canvas id="net" aria-hidden="true"></canvas><div class="wrap"><p class="eyebrow rv">Executive capability development · digital transformation</p><h1 class="rv" style="--d:1">Leaders who <em>speak</em> the language of digital.</h1><p class="lead rv" style="--d:2">SynaptiQ builds the bridge between IT and business. Through executive training and 1:1 mentoring we help decision-makers see the whole digital picture and make their organisations future-proof.</p><div class="rv" style="--d:3"><div class="actions"><a class="btn" href="#products">Our products<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn ghost" href="#check">Readiness check (3 min)</a></div></div><ul class="chips rv" style="--d:4"><li>Common language</li><li>Clear decisions</li><li>Not just AI</li></ul><p class="motto">From Synapse to Strategy</p></div></section><section class="sec" id="about"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Core thesis</p><span class="formula">SynaptiQ = Synapsis + IQ</span><h2>By strengthening the digital capability of leaders, we strengthen the digital intelligence of their organisations.</h2><p class="lead">Every strategic transformation begins with a connection, a synapse. Real competitive advantage emerges where business insight, leadership capability and innovation come together as coherent action.</p></div><div class="grid g3"><div class="card mvv rv" style="--d:0"><h3>Our mission</h3><p>We develop the digital mindset and capability of leaders so that IT and business speak one language, and their organisations decide with clarity instead of hype.</p></div><div class="card mvv rv" style="--d:1"><h3>Our vision</h3><p>A community of organisations led by executives who see the whole digital picture, ask better questions and turn technology into lasting advantage.</p></div><div class="card mvv rv" style="--d:2"><h3>Our principle</h3><p>We don&#x27;t hand out solutions, we give perspective. We don&#x27;t tell you what to do, we help you ask better questions.</p></div></div><div class="card eagle-note rv"><svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 44L60 14l54 30"/><path d="M18 58L60 34l42 24"/><path d="M32 72L60 56l28 16"/><path d="M60 78v10"/><path d="M55 40l5 8 5-8z" fill="currentColor"/></svg><div><h3>Why the eagle?</h3><p>It sees the whole picture from above yet notices the detail. It moves fast, decides decisively and strikes at the best solution. That is the leadership mindset we develop.</p></div></div></div></section><section class="sec alt" id="bridge"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">The IT–business bridge</p><h2>They talk about the same thing, yet don&#x27;t understand each other.</h2><p class=lead>Digital transformation stalls where business and IT leaders don&#x27;t share a language. Try it: tap a sentence to see what the other side hears, and what the common language is.</p></div><div class="xl"><button type="button" class="xc rv" style="--d:0" data-from="b" aria-pressed="false"><span class="who">Business says</span><span class="say">“We need it by next quarter.”</span><span class="hear"><small>IT hears</small>Skip the testing and the security.</span><span class="com"><small>In a common language</small>Define the minimum viable scope and the controls that cannot be skipped.</span><span class="tap">Tap the card <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:1" data-from="b" aria-pressed="false"><span class="who">Business says</span><span class="say">“Just add some AI to it.”</span><span class="hear"><small>IT hears</small>No data, no process, no owner.</span><span class="com"><small>In a common language</small>Which decision or process improves, measured by which KPI, on which data?</span><span class="tap">Tap the card <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:2" data-from="i" aria-pressed="false"><span class="who">IT says</span><span class="say">“Data quality means we have to retrain the model.”</span><span class="hear"><small>Business hears</small>More cost, still no result.</span><span class="com"><small>In a common language</small>Data quality decides reliability, and with it the business value.</span><span class="tap">Tap the card <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:0" data-from="i" aria-pressed="false"><span class="who">IT says</span><span class="say">“We have technical debt.”</span><span class="hear"><small>Business hears</small>An excuse for why IT is slow.</span><span class="com"><small>In a common language</small>Past shortcuts that make every future change slower and costlier.</span><span class="tap">Tap the card <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:1" data-from="b" aria-pressed="false"><span class="who">Business says</span><span class="say">“Let the business build it itself with low-code.”</span><span class="hear"><small>IT hears</small>Shadow IT with no control.</span><span class="com"><small>In a common language</small>Governed digital tooling: clear boundaries, shared ownership.</span><span class="tap">Tap the card <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:2" data-from="i" aria-pressed="false"><span class="who">IT says</span><span class="say">“Token and inference cost call for a different model.”</span><span class="hear"><small>Business hears</small>Jargon.</span><span class="com"><small>In a common language</small>Every AI answer has a price, and it decides which model fits which task.</span><span class="tap">Tap the card <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div></div></section><section class="sec" id="stats"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Impact in numbers</p><h2>Strategy becomes reality through effective leadership.</h2><p class=lead>SynaptiQ turns human intelligence into strategic impact: it gives leaders the clarity, knowledge and confidence to lead digital change.</p></div><div class="stats"><div class="stat rv" style="--d:0"><div class="num"><span data-count="500">500</span><sup>+</sup></div><p>leaders have joined our programmes</p></div><div class="stat rv" style="--d:1"><div class="num"><span data-count="10">10</span><sup>+</sup></div><p>countries we have worked in</p></div><div class="stat rv" style="--d:2"><div class="num"><span data-count="4">4</span></div><p>experienced senior-executive trainers</p></div><div class="stat rv" style="--d:3"><div class="num"><span data-count="70">70</span><sup>%</sup></div><p>practice, 30% theory</p></div></div></div></section><section class="sec alt" id="products"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Our products</p><h2>One connected leadership path, tailored to your company.</h2><p class=lead>Eagle Journey builds the digital foundation. The three modules of Eagle Next then answer the concrete questions of your own organisation. Take them separately or in sequence.</p></div><div class="tabs" role="tablist"><button class="tab" role="tab" id="tab-0" aria-controls="pnl-0" aria-selected="true" tabindex="0" type="button">Eagle Journey</button><button class="tab" role="tab" id="tab-1" aria-controls="pnl-1" aria-selected="false" tabindex="-1" type="button">Eagle Next</button><button class="tab" role="tab" id="tab-2" aria-controls="pnl-2" aria-selected="false" tabindex="-1" type="button">Mentoring &amp; advisory</button></div><div class="panel" role="tabpanel" id="pnl-0" aria-labelledby="tab-0"><div class="prod-top"><div><h3>Eagle Journey</h3><p class="tag">“I understand the digital landscape”</p><p>A two-day, practice-oriented leadership programme. It creates a common language between IT and business and delivers the “aha” moments leaders turn into decisions for their own organisation.</p><ul class="facts"><li><b>Who it is for</b><span>Senior executives and team leaders of mid-sized and larger organisations, regardless of industry or prior knowledge. It is not designed for IT leaders, but for business leaders becoming digital leaders.</span></li><li><b>Format</b><span>2 days, interactive workshops, live demos, your own cases. Content reviewed every quarter.</span></li><li><b>Tangible outcome</b><span>A personal action plan, a Value Generation Canvas and a shared vocabulary.</span></li></ul></div><div class="art" aria-hidden="true"><svg viewBox="0 0 400 300" fill="none" aria-hidden="true"><g stroke="var(--line)" stroke-width="1"><path d="M0 60H400"/><path d="M0 120H400"/><path d="M0 180H400"/><path d="M0 240H400"/></g><polyline points="30,210 66,181 102,176 138,147 174,142 210,113 246,108 282,79 318,74 354,45" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/><circle cx="30" cy="210" r="5" fill="currentColor"/><circle cx="66" cy="181" r="5" fill="currentColor"/><circle cx="102" cy="176" r="5" fill="currentColor"/><circle cx="138" cy="147" r="5" fill="currentColor"/><circle cx="174" cy="142" r="5" fill="currentColor"/><circle cx="210" cy="113" r="5" fill="currentColor"/><circle cx="246" cy="108" r="5" fill="currentColor"/><circle cx="282" cy="79" r="5" fill="currentColor"/><circle cx="318" cy="74" r="5" fill="currentColor"/><circle cx="354" cy="45" r="8" fill="var(--accent2,currentColor)"/><g transform="translate(250 30) scale(.8)" stroke="var(--fg)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"><path d="M6 44L60 14l54 30"/><path d="M18 58L60 34l42 24"/><path d="M32 72L60 56l28 16"/><path d="M60 78v10"/></g></svg></div></div><div class="days"><div class="card"><h4>Day 1 · Practical AI tools, agentic AI, use cases</h4><ul class="ticks"><li>Value Generation Canvas: a concrete tool to uncover your own value</li><li>New trends and AI tools, live demos</li><li>What makes a good AI use case, and where transitions go wrong</li><li>EU AI Act: the latest regulatory framework</li><li>Agentic AI through individual and group exercises</li></ul></div><div class="card"><h4>Day 2 · Cloud, FinOps, digital tooling, digital leadership</h4><ul class="ticks"><li>FinOps for AI: token-based pricing, SLMs and on-premise AI</li><li>Digital tooling (LCNC) and the substitution matrix</li><li>Business–IT collaboration in the age of AI</li><li>Critical thinking and hallucination</li><li>Personal and organisational action plan in the closing block</li></ul></div></div><div class="mods"><h4>The 10 modules of Eagle Journey</h4><ul class="modlist"><li>Eagle Introduction</li><li>Data &amp; AI Mindset</li><li>AI Focus Blocks</li><li>Cloud for Executives</li><li>Low-Code / No-Code</li><li>Value Generation</li><li>Technical Teams</li><li>Data Enablement</li><li>Digital Org</li><li>Knowledge Test</li></ul></div></div><div class="panel" role="tabpanel" id="pnl-1" aria-labelledby="tab-1" hidden><div class="prod-top"><div><span class="badge">New · 2026</span><h3>Eagle Next</h3><p class="tag">Practical leadership path after the foundation</p><p>Three consecutive trainings forming one connected leadership path. Blended format: e-learning, use-case pre-work and a workshop. Every leader works on their own initiative and leaves with an action plan.</p></div><div class="art" aria-hidden="true"><svg viewBox="0 0 400 300" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="24" y="70" width="104" height="150" rx="10" fill="var(--surface2)"/><rect x="148" y="70" width="104" height="150" rx="10" fill="var(--surface2)"/><rect x="272" y="70" width="104" height="150" rx="10" fill="var(--surface2)"/></g><g stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><path d="M42 106h68M42 128h52M42 150h60M166 106h68M166 128h40M166 150h62M290 106h68M290 128h56M290 150h44"/></g><g fill="currentColor"><circle cx="76" cy="194" r="9"/><circle cx="200" cy="194" r="9"/><circle cx="324" cy="194" r="9"/></g><g stroke="var(--accent2,currentColor)" stroke-width="3" stroke-linecap="round"><path d="M132 245h16M256 245h16"/><path d="M144 238l8 7-8 7M268 238l8 7-8 7"/></g></svg></div></div><h4 class="sr">The three steps</h4><div class="flow"><button type="button" class="fl" aria-pressed="true"><span class="n">01</span><span class="k">STRATEGY → VALUE</span><span class="t">Digital Strategy to Action</span><span class="w">WHY</span></button><button type="button" class="fl" aria-pressed="false"><span class="n">02</span><span class="k">VALUE → DELIVERY</span><span class="t">Bank-Ready Delivery</span><span class="w">HOW</span></button><button type="button" class="fl" aria-pressed="false"><span class="n">03</span><span class="k">AI → NEXT</span><span class="t">From Gen AI to Agentic AI</span><span class="w">WHAT&#x27;S NEXT</span></button></div><div class="card mdetail"><div><p class="eyebrow">Leadership question</p><p class="qq">Which digital initiatives bring the organisation closer to its measurable goals?</p><ul class="facts"><li><b>Format</b><span>60–90 min e-learning, then a one-day workshop on your own goal with peer feedback.</span></li><li><b>Tangible outcome</b><span>Digital Initiative Canvas and a 6–12 month Initiative Portfolio.</span></li></ul></div><ol class="steps5"><li>From strategy to measurable outcomes</li><li>From outcome to missing capability</li><li>From capability to technology requirement</li><li>To an initiative portfolio</li><li>Take your own goal through the model</li></ol></div><div class="card mdetail" hidden><div><p class="eyebrow">Leadership question</p><p class="qq">How does a digital idea start in a regulated environment in a deliverable way, with less rework?</p><ul class="facts"><li><b>Format</b><span>90–120 min e-learning and a one-day governance workshop with your own project and role play.</span></li><li><b>Tangible outcome</b><span>Bank-Ready Project Canvas, governance and readiness checklist, stakeholder map.</span></li></ul></div><ol class="steps5"><li>Why good projects get stuck: reuse before build</li><li>Know your data before design</li><li>Choose the right delivery route</li><li>Ownership, lifecycle, pilot</li><li>Bank-ready project workshop</li></ol></div><div class="card mdetail" hidden><div><p class="eyebrow">Leadership question</p><p class="qq">Where does the new wave of AI create value, and under what conditions should it be adopted?</p><ul class="facts"><li><b>Format</b><span>45–60 min e-learning, a live agent demo, a reliability exercise and your own AI use case.</span></li><li><b>Tangible outcome</b><span>AI Opportunity &amp; Readiness Canvas and a leadership action plan.</span></li></ul></div><ol class="steps5"><li>Spot AI opportunities in your own process</li><li>Business value with a success indicator</li><li>Agentic AI: demo vs reality, enterprise readiness</li><li>Human AI literacy: critical thinking</li><li>AI economics: which model for which task</li></ol></div></div><div class="panel" role="tabpanel" id="pnl-2" aria-labelledby="tab-2" hidden><div class="prod-top"><div><h3>Mentoring &amp; advisory</h3><p class="tag">1:1 and tailor-made</p><p>We tailor every programme to the organisation and add 1:1 mentoring and consulting. Together we assess where the organisation stands today and where it wants to go.</p></div><div class="art" aria-hidden="true"><svg viewBox="0 0 400 300" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4"><circle cx="110" cy="150" r="58" fill="var(--surface2)"/><circle cx="290" cy="150" r="58" fill="var(--surface2)"/></g><path d="M168 150h64" stroke="var(--accent2,currentColor)" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g fill="currentColor"><circle cx="110" cy="134" r="14"/><path d="M82 184c4-18 52-18 56 0z"/><circle cx="290" cy="134" r="14"/><path d="M262 184c4-18 52-18 56 0z"/></g></svg></div></div><div class="adv" style="margin-top:0"><div class="card"><h4>Capability assessment</h4><p>A joint assessment of current and target levels of transformative digital capabilities.</p></div><div class="card"><h4>Tailor-made programme</h4><p>Cases and dilemmas from your own operating reality, not examples from an ideal organisation.</p></div><div class="card"><h4>1:1 executive mentoring</h4><p>Personal support to deliver the action plan and lead the team.</p></div><div class="card"><h4>Strategic advisory</h4><p>Initiative portfolio, feasibility, controls and regulatory fit.</p></div></div></div><p class="portfolio">Eagle Journey is part of the Pulze Digital executive capability portfolio. Not a standalone course, but a system.</p></div></section><section class="sec" id="method"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Our methodology</p><h2>From capability assessment to lasting change.</h2><p class=lead>The learning journey is led by experts who not only teach these capabilities but apply them in real business environments. The approach stays focused, hands-on and built on a leadership mindset.</p></div><div class="msteps"><div class="ms rv" style="--d:0"><h3>Assess</h3><p>Together we look at where the organisation stands and where it aims to be.</p></div><div class="ms rv" style="--d:1"><h3>Learn</h3><p>Knowledge and practice for leaders: 70% practice, 30% theory.</p></div><div class="ms rv" style="--d:2"><h3>Apply</h3><p>Your own cases and dilemmas, translated directly into decisions.</p></div><div class="ms rv" style="--d:3"><h3>Sustain</h3><p>Action plan, mentoring and quarterly content refresh.</p></div></div><div class="ska rv"><div><h3>SKA methodology</h3><p>Skill, Knowledge and Attitude run through the whole programme, so learning goes beyond one-off knowledge transfer and produces lasting capability and mindset change.</p></div><div class="tri"><div><strong>Skill</strong><span>Capability</span></div><div><strong>Knowledge</strong><span>Understanding</span></div><div><strong>Attitude</strong><span>Mindset</span></div></div></div><h3 class="trh rv">Led by former senior executives</h3><div class="grid g3"><div class="card tr rv" style="--d:0"><h3>They have sat in the decision-maker&#x27;s chair</h3><p>They understand decision dilemmas, pressure and uncertainty, so they are credible to leaders from both the business and the digital side.</p></div><div class="card tr rv" style="--d:1"><h3>A four-person expert community</h3><p>Trainers continuously share knowledge and field experience. No lone lecturers.</p></div><div class="card tr rv" style="--d:2"><h3>Always up to date</h3><p>Quarterly review based on market and technology research and on field experience.</p></div></div></div></section><section class="sec alt" id="check"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Readiness check</p><h2>How ready is your leadership team?</h2><p class=lead>Eight questions, three minutes. The result shows four dimensions, where your organisation is strong, and which of our programmes fits. Your answers never leave your browser.</p></div><div class="quiz rv" id="quiz"><div class="qbox" id="quiz-body" aria-live="polite"></div></div><script type="application/json" id="quiz-data">{"q": ["Our digital initiatives are tied to measurable business goals and KPIs.", "Our leadership team shares a clear picture of where AI and digital technology create real value.", "We know which of our data we can trust, and data quality has an owner.", "Our leaders can decide when a chatbot, automation or an AI agent is enough.", "From idea to operations we have clear owners, controls and lifecycle.", "Business and IT use the same concepts when they talk about a project.", "Colleagues can build their own digital solutions safely, within governed boundaries.", "Our leaders can motivate the team and know who to develop, and to what level."], "dimOf": [0, 0, 1, 1, 2, 2, 3, 3], "dims": ["strategy", "data", "delivery", "people"], "dimNames": {"strategy": "Strategy & value", "data": "Data & AI", "delivery": "Delivery", "people": "People & culture"}, "scale": ["Not at all", "Partly", "Mostly", "Fully"], "qof": "question", "next": "Next", "prev": "Back", "see": "See result", "restart": "Start over", "levels": ["Starting", "Developing", "Advanced", "Leading"], "recs": {"strategy": ["Eagle Next 01 · Digital Strategy to Action", "Turns an organisational goal into a measurable, prioritised initiative portfolio."], "data": ["Eagle Journey · Data & AI Mindset", "Grounds data- and AI-aware leadership decisions and builds a common language."], "delivery": ["Eagle Next 02 · Bank-Ready Delivery", "Shows how an idea reaches controlled, working delivery."], "people": ["Eagle Journey · Digital Leadership", "Focuses on the leader's role, motivating the team and driving culture change."]}, "resultT": "Your result", "lowest": "Biggest area for growth", "cta": "Let's discuss the result", "msg": "I completed the digital readiness check. Result: {score}/100, biggest area for growth: {dim}. I'd like to talk about the options."}</script></div></section><section class="sec" id="voices"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">What they said</p><h2>Leadership reflections from the room.</h2><p class=lead>Real participant feedback from the programme.</p></div><div class="voices"><figure class="card voice rv" style="--d:0"><blockquote>It was genuinely valuable to leave with tools I can use in my day-to-day work, backed by more depth than I had expected. I walked away with a clear sense of where I can take my team as a leader, and picked up knowledge I can use in my personal life too.</blockquote><figcaption><i>SQ</i>Executive participant</figcaption></figure><figure class="card voice rv" style="--d:1"><blockquote>The pacing was excellent and the programme gave real conceptual structure to the topic. On day one I went home and built something on the spot that impressed my wife. By day two she was the one greeting me with what she had made using the AI tools I had shown her the night before. Inspiring.</blockquote><figcaption><i>SQ</i>Business unit leader</figcaption></figure><figure class="card voice rv" style="--d:0"><blockquote>It opened doors I had only been looking at from a distance until now.</blockquote><figcaption><i>SQ</i>Functional leader</figcaption></figure><figure class="card voice rv" style="--d:1"><blockquote>I genuinely enjoyed it. It broadened my perspective. The group was excellent, and it was great to meet people like this. I came away with tools I&#x27;m still absorbing. By the end of day one I was already telling my colleagues to join, and I&#x27;ve recommended it to my manager as well.</blockquote><figcaption><i>SQ</i>Transformation lead</figcaption></figure></div></div></section><section class="sec alt" id="faq"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">FAQ</p><h2>What leaders ask us most.</h2></div><div class="faq rv"><details><summary>Who is Eagle Journey for?</summary><p>Senior executives and team leaders of mid-sized and larger organisations, regardless of industry or prior knowledge. It is not designed for IT leaders, but for business leaders becoming digital leaders, while building a bridge to IT.</p></details><details><summary>Is it only about AI?</summary><p>No. AI is an important milestone, but we cover the full digital picture: data, cloud and FinOps, digital tooling (LCNC), regulation, organisation and leadership culture. Everyone is pushing AI; we give the wider perspective.</p></details><details><summary>How long does it take?</summary><p>Eagle Journey takes two days. The three Eagle Next modules each combine e-learning with one workshop day, and can be taken separately or in sequence.</p></details><details><summary>Can the programme be tailored to our company?</summary><p>Yes. Every programme is built around your own cases, dilemmas and operating reality, and complemented by 1:1 mentoring and consulting.</p></details><details><summary>How is the content kept current?</summary><p>Through a quarterly review cycle, based on market and technology research and on the field experience of our trainer community.</p></details><details><summary>What do participants leave with?</summary><p>A shared vocabulary, their own action plan and concrete tools (such as the Value Generation Canvas) they can use the next day.</p></details></div></div></section><section class="sec" id="contact"><div class="wrap"><div class="contact"><div class="side rv"><p class="eyebrow">Contact</p><h2>Every collaboration starts with a conversation.</h2><p class="lead" style="margin-top:18px">Tell us a few things about your organisation, your leadership development goals and your current challenges.</p><h3 style="font-size:1rem;margin:30px 0 8px">Get in touch</h3><a class="mail" href="mailto:info@synaptiq.hu">info@synaptiq.hu</a><p style="margin-top:14px">Suitable for leadership development discussions, training inquiries or consulting conversations.</p></div><div class="rv" style="--d:1"><form class="cf" id="cf" novalidate><div class="fsum" id="cf-sum" role="alert" hidden>Please correct the highlighted fields.</div><div class="fld"><label for="f-name">Name</label><input id="f-name" name="f-name" type="text" required aria-required="true" aria-describedby="f-name-e" autocomplete="name"><span class="err" id="f-name-e" data-msg="Please enter your name." role="alert"></span></div><div class="fld"><label for="f-email">Email</label><input id="f-email" name="f-email" type="email" required aria-required="true" aria-describedby="f-email-e" autocomplete="email"><span class="err" id="f-email-e" data-msg="Please enter a valid email address." role="alert"></span></div><div class="fld"><label for="f-company">Company <small>(optional)</small></label><input id="f-company" name="f-company" type="text" autocomplete="organization"></div><div class="fld"><label for="f-role">Role <small>(optional)</small></label><input id="f-role" name="f-role" type="text" autocomplete="organization-title"></div><div class="fld full"><label for="f-msg">Message</label><textarea id="f-msg" name="f-msg" rows="5" required aria-required="true" aria-describedby="f-msg-e"></textarea><span class="err" id="f-msg-e" data-msg="Please write a message of at least 10 characters." role="alert"></span></div><div class="fld full"><label class="chk" for="f-consent"><input type="checkbox" id="f-consent" aria-describedby="f-consent-e" required aria-required="true"><span>I have read the privacy notice. <a href="/en/privacy/" data-legal="privacy" data-close="Close">Privacy policy</a></span></label><span class="err" id="f-consent-e" data-msg="You need to accept the privacy notice to send." role="alert"></span></div><div class="fld full"><button class="btn" type="submit">Send message<svg viewBox="0 0 24 24" fill="none" stroke="current   /* ---------- megjelenés, számlálók, aktív menü ---------- */
  var io, io2;
  function bindReveal() {

    }, { threshold: .12, rootMargin: '0px 0px -6% 0px' });
    items.forEach(function (e) { io.observe(e); });
    if (io2) io2.disconnect();
    var links = {}; $$('#nav a.nl').forEach(function (a) { links[a.getAttribute('href').split('#')[1]] = a; });
    io2 = new IntersectionObserver(function (es) {

  }

  }

  /* ---------- fordító kártyák ---------- */
  function bindXl() {

  }

  /* ---------- termék fülek + Eagle Next ---------- */
  function bindTabs() {
    var tabs = $$('.tab');
    function sel(t) {
      tabs.forEach(function (x) { var on = x === t; x.setAttribute('aria-selected', String(on)); x.tabIndex = on ? 0 : -1; $('#' + x.getAttribute('aria-controls')).hidden = !on; });

        if (e.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length]; else if (e.key === 'ArrowLeft') n = tabs[(i - 1 + tabs.length) % tabs.length];
        else if (e.key === 'Home') n = tabs[0]; else if (e.key === 'End') n = tabs[tabs.length - 1];
        if (n) { e.preventDefault(); n.focus(); sel(n); }

    });
    var fls = $$('.fl'), dets = $$('.mdetail');
    fls.forEach(function (f, i) {
      f.onclick = function () { fls.forEach(function (x, j) { x.setAttribute('aria-pressed', String(i === j)); dets[j].hidden = i !== j; }); };
    });
  }

  /* ---------- kvíz ---------- */
  function bindQuiz() {
    var q = $('#quiz'); if (!q) return;
    var cfg = JSON.parse($('#quiz-data').textContent);
    var Q = cfg.q, dimOf = cfg.dimOf, dims = cfg.dims, dimNames = cfg.dimNames, i = 0, ans = [];
    var body = $('#quiz-body');
    function render() {
      var v = ans[i];
      var opts = cfg.scale.map(function (s, k) {
        return '<label><input type="radio" name="qa" value="' + k + '"' + (v === k ? ' checked' : '') + '><span>' + s + '</span></label>';
      }).join('');
      body.innerHTML = '<div class="qbar" role="progressbar" aria-valuemin="1" aria-valuemax="' + Q.length + '" aria-valuenow="' + (i + 1) + '"><i style="width:' + ((i + 1) / Q.length * 100) + '%"></i></div>' +
        '<div class="qmeta">' + (i + 1) + ' / ' + Q.length + ' ' + cfg.qof + ' · ' + dimNames[dims[dimOf[i]]] + '</div>' +
        '<fieldset class="qopts-wrap" style="border:0;padding:0;margin:0"><legend class="qtext" id="qlegend" tabindex="-1">' + Q[i] + '</legend><div class="qopts" role="radiogroup" aria-labelledby="qlegend">' + opts + '</div></fieldset>' +
        '<div class="qnav"><button type="button" class="btn ghost sm" id="qprev"' + (i === 0 ? ' disabled style="visibility:hidden"' : '') + '>' + cfg.prev + '</button>' +
        '<button type="button" class="btn sm" id="qnext"' + (v === undefined ? ' disabled' : '') + '>' + (i === Q.length - 1 ? cfg.see : cfg.next) + '</button></div>';
      $$('input[name=qa]', body).forEach(function (r) {
        r.onchange = function () { ans[i] = +r.value; $('#qnext').disabled = false; };
      });
      $('#qprev').onclick = function () { i--; render(); $('#qlegend').focus({ preventScroll: true }); };
      $('#qnext').onclick = function () { if (i < Q.length - 1) { i++; render(); $('#qlegend').focus({ preventScroll: true }); } else result(); };
    }
    function result() {
      var sums = [0, 0, 0, 0], cnt = [0, 0, 0, 0];
      ans.forEach(function (a, k) { sums[dimOf[k]] += a; cnt[dimOf[k]]++; });
      var pct = sums.map(function (s, k) { return Math.round(s / (cnt[k] * 3) * 100); });
      var total = Math.round(ans.reduce(function (a, b) { return a + b; }, 0) / (Q.length * 3) * 100);
      var low = pct.indexOf(Math.min.apply(null, pct));
      var lvl = cfg.levels[total < 25 ? 0 : total < 50 ? 1 : total < 75 ? 2 : 3];
      var cx = 150, cy = 150, R = 100, n = 4, pts = [], grid = '', labels = '';
      for (var g = 1; g <= 4; g++) { var rr = R * g / 4, gp = []; for (var a = 0; a < n; a++) { var ang = -Math.PI / 2 + a * 2 * Math.PI / n; gp.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1)); } grid += '<polygon class="grid-l" points="' + gp.join(' ') + '"/>'; }
      for (var a2 = 0; a2 < n; a2++) {
        var an = -Math.PI / 2 + a2 * 2 * Math.PI / n, rv = R * Math.max(pct[a2], 6) / 100;
        pts.push((cx + rv * Math.cos(an)).toFixed(1) + ',' + (cy + rv * Math.sin(an)).toFixed(1));
        grid += '<line class="grid-l" x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(an)).toFixed(1) + '" y2="' + (cy + R * Math.sin(an)).toFixed(1) + '"/>';
        var lx = cx + (R + 18) * Math.cos(an), ly = cy + (R + 18) * Math.sin(an), anc = Math.abs(Math.cos(an)) < .2 ? 'middle' : (Math.cos(an) > 0 ? 'start' : 'end');
        labels += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + anc + '">' + dimNames[dims[a2]] + '</text>';
      }
      var rec = cfg.recs[dims[low]];
      var list = dims.map(function (k, j) { return '<li><span>' + dimNames[k] + '</span><span class="bar"><i style="width:' + pct[j] + '%"></i></span><span>' + pct[j] + '%</span></li>'; }).join('');
      var msg = cfg.msg.replace('{score}', total).replace('{dim}', dimNames[dims[low]]);
      body.innerHTML = '<div class="res"><div><svg class="radar" viewBox="-130 0 560 300" role="img" aria-label="' + cfg.resultT + ': ' + total + '/100">' + grid + '<polygon class="shape" points="' + pts.join(' ') + '"/>' + labels + '</svg></div>' +
        '<div><div class="qmeta">' + cfg.resultT + '</div><div class="big" id="qres" tabindex="-1">' + total + '<small>/100</small></div><span class="lvl">' + lvl + '</span><ul class="dims">' + list + '</ul>' +
        '<div class="rec"><span class="qmeta" style="margin:0 0 4px">' + cfg.lowest + '</span><b>' + rec[0] + '</b><span>' + rec[1] + '</span></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn sm" href="#contact" id="qcta">' + cfg.cta + '</a><button type="button" class="btn ghost sm" id="qre">' + cfg.restart + '</button></div></div></div>';
      $('#qres').focus({ preventScroll: true });
      $('#qre').onclick = function () { i = 0; ans = []; render(); };
      $('#qcta').onclick = function () { var m = $('#f-msg'); if (m && !m.value) m.value = msg; };
    }
    render();
  }

  /* ---------- űrlap (csak kliensoldali, bemutató) ---------- */
  function bindForm() {
    var f = $('#cf'); if (!f) return;
    var ok = $('#cf-ok'), sum = $('#cf-sum');
    function setErr(id, bad) {
      var el = $('#' + id), er = $('#' + id + '-e'); if (!el || !er) return;
      el.setAttribute('aria-invalid', bad ? 'true' : 'false');

    }

      'f-email': function (v) { return !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); },
      'f-msg': function (v) { return v.trim().length < 10; },
      'f-consent': function () { return !$('#f-consent').checked; }
    };
    Object.keys(rules).forEach(function (id) {
      var el = $('#' + id);

      el.addEventListener('input', function () { if (el.getAttribute('aria-invalid') === 'true') setErr(id, rules[id](el.type === 'checkbox' ? '' : el.value)); });

        var el = $('#' + id), bad = rules[id](el.type === 'checkbox' ? '' : el.value);

      var a = $('#cf-mail');

    var again = $('#cf-again'); if (again) again.onclick = function () { f.reset(); f.hidden = false; ok.hidden = true; $$('[aria-invalid]', f).forEach(function (x) { x.setAttribute('aria-invalid', 'false'); }); $('#f-name').focus(); };
  }

  /* ---------- süti tájékoztató ---------- */

  }

  /* ---------- hero hálózat (canvas) ---------- */
  var raf;
  function bindNet() {
    var cv = $('#net'); if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'), W, H, dpr, pts = [], mouse = { x: -999, y: -999 };
    function css(v) { return getComputedStyle(root).getPropertyValue(v).trim() || '#4de'; }
    function size() {

      var n = Math.round(Math.min(70, Math.max(28, W * H / 16000)));

    }

        for (var j = i + 1; j < pts.length; j++) {

          if (dist < link) { ctx.globalAlpha = (1 - dist / link) * .55; ctx.strokeStyle = a1; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
        }

        if (md < 170) { ctx.globalAlpha = (1 - md / 170) * .9; ctx.strokeStyle = a2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
        ctx.globalAlpha = .9; ctx.fillStyle = i % 5 === 0 ? a2 : a1; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function loop() { draw(false); raf = requestAnimationFrame(loop); }
    size();
    if (raf) cancelAnimationFrame(raf);
    if (reduce) draw(true); else loop();
    var hero = cv.parentElement;
    hero.addEventListener('pointermove', function (e) { var r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
    hero.addEventListener('pointerleave', function () { mouse.x = mouse.y = -999; });

    if ('IntersectionObserver' in window && !reduce) {
      new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { if (!raf) loop(); } else { cancelAnimationFrame(raf); raf = 0; } }); }).observe(cv);
    }
  }

  /* ---------- egyfájlos mód: nyelv + jogi ablak ---------- */
  function bindSingle() {

    });

        e.preventDefault();
        var t = d.getElementById('tpl-' + root.lang + '-' + a.dataset.legal), dlg = d.getElementById('legal-dlg');

  function mount() {
