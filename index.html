/* SynaptiQ – közös alapstílus. A dizájnok a :root tokeneket és néhány szekciót írják felül. */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img,svg,canvas{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.1;margin:0;font-weight:var(--head-w,700);letter-spacing:var(--head-ls,-.02em)}
h1{font-size:clamp(2.5rem,6.4vw,5rem)}
h2{font-size:clamp(1.9rem,3.8vw,3.1rem)}
h3{font-size:clamp(1.2rem,2vw,1.5rem)}
p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:8px;z-index:200;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
.wrap{width:min(1200px,100% - 2*clamp(16px,4vw,40px));margin-inline:auto}
.sec{padding-block:clamp(64px,10vw,128px);position:relative}
.sec.alt{background:var(--bg2)}
.eyebrow{font-family:var(--font-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent-text);margin:0 0 18px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:2px;background:currentColor;opacity:.7}
.lead{font-size:clamp(1.05rem,1.5vw,1.25rem);color:var(--muted);max-width:62ch}
.sec-head{max-width:860px;margin-bottom:clamp(36px,5vw,64px)}
.sec-head h2{margin-bottom:20px}
em{font-style:normal;color:var(--accent-text)}

/* progress + top */
.progress{position:fixed;inset:0 0 auto 0;height:3px;z-index:120;background:transparent;pointer-events:none}
.progress i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent2))}
.to-top{position:fixed;right:clamp(14px,3vw,28px);bottom:clamp(14px,3vw,28px);z-index:90;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s,background .2s;box-shadow:var(--shadow)}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{background:var(--accent);color:var(--on-accent)}
.to-top svg{width:20px;height:20px}

/* header */
.site-head{position:sticky;top:0;z-index:100;background:var(--head-bg);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,background .3s}
.site-head.scrolled{border-bottom-color:var(--line)}
.head-in{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-head);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:var(--fg)}
.logo svg{width:34px;height:34px;color:var(--accent)}
.logo b{color:var(--accent-text);font-weight:800}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav a.nl{padding:10px 14px;border-radius:999px;text-decoration:none;font-size:.95rem;font-weight:500;color:var(--muted);transition:color .2s,background .2s}
.nav a.nl:hover,.nav a.nl[aria-current="true"]{color:var(--fg);background:var(--chip)}
.tools{display:flex;align-items:center;gap:8px;margin-left:8px}
.ibtn,.lang{height:42px;min-width:42px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);display:inline-grid;place-items:center;cursor:pointer;font:600 .8rem var(--font-mono);letter-spacing:.06em;text-decoration:none;padding:0 12px;transition:background .2s,border-color .2s}
.ibtn:hover,.lang:hover{background:var(--chip);border-color:var(--muted)}
.ibtn svg{width:19px;height:19px}
.theme-btn .i-sun{display:none}
[data-theme="dark"] .theme-btn .i-sun{display:block}
[data-theme="dark"] .theme-btn .i-moon{display:none}
.menu-btn{display:none}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:var(--btn-r,999px);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1rem;text-decoration:none;border:2px solid var(--accent);cursor:pointer;font-family:inherit;transition:transform .2s,box-shadow .2s,background .2s,color .2s;line-height:1.2}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px var(--accent)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg);box-shadow:none}
.btn.sm{padding:10px 20px;font-size:.92rem}
.btn svg{width:18px;height:18px}

@media (max-width:980px){
  .site-head{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .menu-btn{display:inline-grid;margin-left:auto}
  .tools{margin-left:0}
  .nav{position:fixed;inset:72px 0 0 0;flex-direction:column;align-items:stretch;gap:4px;padding:24px clamp(16px,4vw,40px) 40px;background:var(--bg);margin:0;overflow-y:auto;transform:translateY(-8px);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
  .nav.open{opacity:1;transform:none;visibility:visible}
  .nav a.nl{font-size:1.5rem;font-family:var(--font-head);padding:16px 8px;border-radius:12px;color:var(--fg);border-bottom:1px solid var(--line);border-radius:0}
  .nav .btn{justify-content:center;margin-top:20px}
  .head-in{gap:10px}
}
body.menu-lock{overflow:hidden}

/* hero shared */
.hero{position:relative;overflow:hidden}
.hero h1 em{display:inline}
.hero .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.chips li{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;color:var(--muted);background:var(--chip)}
.motto{font-family:var(--font-mono);font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vw,34px)}
.grid{display:grid;gap:clamp(16px,2vw,24px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

/* about */
.formula{display:inline-block;font-family:var(--font-mono);font-size:clamp(.85rem,1.4vw,1rem);padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--chip);margin-bottom:26px}
.mvv h3{font-size:1.05rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent-text);font-weight:600;margin-bottom:12px}
.mvv p{margin:0;font-size:1.05rem}
.eagle-note{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-top:clamp(20px,3vw,32px)}
.eagle-note svg{width:clamp(72px,10vw,120px);height:auto;color:var(--accent)}
.eagle-note h3{margin-bottom:8px}
.eagle-note p{margin:0;color:var(--muted)}
@media (max-width:560px){.eagle-note{grid-template-columns:1fr}}

/* translator */
.xl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,22px)}
@media (max-width:980px){.xl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.xl{grid-template-columns:minmax(0,1fr)}}
.xc{position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px;min-height:230px;display:flex;flex-direction:column;gap:10px;transition:border-color .25s,transform .25s,background .25s}
.xc:hover{border-color:var(--accent);transform:translateY(-3px)}
.xc .who{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.xc .say{font-family:var(--font-head);font-size:1.3rem;line-height:1.25;font-weight:600}
.xc .hear,.xc .com{display:none;font-size:1rem}
.xc .hear{color:var(--muted)}
.xc .com{color:var(--fg);padding-top:12px;border-top:1px dashed var(--line)}
.xc .com small,.xc .hear small{display:block;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
.xc .tap{margin-top:auto;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.xc[aria-pressed="true"]{background:var(--surface2);border-color:var(--accent)}
.xc[aria-pressed="true"] .hear,.xc[aria-pressed="true"] .com{display:block}
.xc[aria-pressed="true"] .tap{display:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:clamp(26px,4vw,48px) clamp(14px,2vw,28px);border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .num{font-family:var(--font-head);font-weight:var(--num-w,800);font-size:clamp(2.6rem,6vw,4.6rem);line-height:1;letter-spacing:-.04em;color:var(--fg)}
.stat .num sup{font-size:.5em;color:var(--accent-text);top:-.7em;position:relative;vertical-align:baseline}
.stat p{margin:12px 0 0;color:var(--muted);font-size:.98rem;max-width:22ch}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* products */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{font:600 1rem var(--font-body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:14px 20px;cursor:pointer;margin-bottom:-1px;border-radius:0;transition:color .2s,border-color .2s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}
.prod-top{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,56px);align-items:start;margin-bottom:clamp(28px,4vw,44px)}
@media (max-width:900px){.prod-top{grid-template-columns:minmax(0,1fr)}}
.prod-top h3{font-size:clamp(1.8rem,3.4vw,2.6rem);margin-bottom:6px}
.prod-top .tag{font-family:var(--font-mono);font-size:.85rem;color:var(--accent-text);margin:0 0 18px}
.prod-top p{color:var(--muted)}
.facts{display:grid;gap:0;margin:0;padding:0;list-style:none}
.facts li{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:132px 1fr;gap:16px;font-size:.98rem}
.facts li:last-child{border-bottom:1px solid var(--line)}
.facts b{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);padding-top:4px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2vw,24px)}
@media (max-width:760px){.days{grid-template-columns:minmax(0,1fr)}}
.days h4,.mods h4{font-size:1.1rem;margin-bottom:14px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticks li{position:relative;padding-left:26px;font-size:.98rem;color:var(--muted)}
.ticks li::before{content:"";position:absolute;left:0;top:.55em;width:14px;height:2px;background:var(--accent)}
.mods{margin-top:clamp(20px,3vw,32px)}
.modlist{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none;counter-reset:m}
.modlist li{counter-increment:m;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--chip);font-size:.92rem;display:flex;gap:10px;align-items:center}
.modlist li::before{content:counter(m,decimal-leading-zero);font-family:var(--font-mono);font-size:.72rem;color:var(--accent-text)}
.art{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:var(--accent)}
.art svg{width:100%;height:100%}
.badge{display:inline-block;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);margin-bottom:16px;font-weight:700}

/* next flow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,22px);counter-reset:f;margin-bottom:26px}
@media (max-width:900px){.flow{grid-template-columns:minmax(0,1fr)}}
.fl{position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px;transition:border-color .25s,background .25s,transform .25s}
.fl:hover{border-color:var(--muted)}
.fl[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2)}
.fl .n{font-family:var(--font-head);font-weight:800;font-size:2.4rem;line-height:1;color:var(--accent-text)}
.fl .k{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;color:var(--muted)}
.fl .t{font-family:var(--font-head);font-size:1.25rem;font-weight:700;line-height:1.2}
.fl .w{margin-top:8px;align-self:flex-start;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.fl:not(:last-child)::after{content:"→";position:absolute;right:-19px;top:50%;transform:translateY(-50%);color:var(--accent-text);font-size:1.4rem;z-index:2;background:var(--bg);width:20px;text-align:center}
@media (max-width:900px){.fl:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-22px;transform:translateX(-50%);height:22px;line-height:22px}}
.mdetail{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,40px)}
@media (max-width:820px){.mdetail{grid-template-columns:minmax(0,1fr)}}
.mdetail .qq{font-family:var(--font-head);font-size:clamp(1.25rem,2.2vw,1.7rem);line-height:1.3;margin:0 0 20px}
.steps5{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps5 li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;font-size:.98rem;align-items:start}
.steps5 li::before{content:counter(s);width:30px;height:30px;border-radius:50%;border:1px solid var(--accent);color:var(--accent-text);display:grid;place-items:center;font:600 .8rem var(--font-mono)}
.adv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,22px);margin-top:26px}
@media (max-width:700px){.adv{grid-template-columns:minmax(0,1fr)}}
.adv .card h4{font-size:1.15rem;margin-bottom:8px}
.adv .card p{margin:0;color:var(--muted);font-size:.98rem}
.portfolio{margin-top:clamp(28px,4vw,44px);padding:20px 24px;border-left:3px solid var(--accent);background:var(--chip);border-radius:0 var(--radius) var(--radius) 0;color:var(--muted);font-size:.98rem}

/* method */
.msteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:ms;position:relative;margin-bottom:clamp(36px,5vw,60px)}
@media (max-width:900px){.msteps{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}}
@media (max-width:560px){.msteps{grid-template-columns:minmax(0,1fr)}}
.ms{counter-increment:ms;padding:26px 24px 8px 0;position:relative;border-top:2px solid var(--line)}
.ms::before{content:"";position:absolute;top:-6px;left:0;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ms::after{content:counter(ms,decimal-leading-zero);position:absolute;top:22px;right:20px;font:600 .8rem var(--font-mono);color:var(--muted)}
.ms h3{margin-bottom:10px}
.ms p{color:var(--muted);font-size:.98rem;margin:0}
.ska{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,4vw,56px);align-items:center;margin-bottom:clamp(36px,5vw,60px)}
@media (max-width:860px){.ska{grid-template-columns:minmax(0,1fr)}}
.ska h3{margin-bottom:12px}
.ska p{color:var(--muted);margin:0}
.tri{display:flex;gap:14px;flex-wrap:wrap}
.tri div{flex:1 1 140px;padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-align:center}
.tri strong{display:block;font-family:var(--font-head);font-size:1.5rem}
.tri span{font-size:.85rem;color:var(--muted);font-family:var(--font-mono)}
.tr h3{font-size:1.1rem;margin-bottom:10px}
.tr p{color:var(--muted);font-size:.98rem;margin:0}
.trh{font-size:clamp(1.4rem,2.6vw,2rem);margin:0 0 22px}

/* quiz */
.quiz{max-width:900px}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,4vw,44px)}
.qbar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:26px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}
.qmeta{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.1em;color:var(--accent-text);text-transform:uppercase;margin-bottom:12px}
.qtext{font-family:var(--font-head);font-size:clamp(1.3rem,2.6vw,1.85rem);line-height:1.3;margin:0 0 26px;font-weight:600;letter-spacing:-.01em}
.qopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;border:0;padding:0;margin:0}
@media (max-width:640px){.qopts{grid-template-columns:minmax(0,1fr)}}
.qopts label{position:relative;display:block}
.qopts input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.qopts span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-weight:600;font-size:.95rem;transition:border-color .2s,background .2s,color .2s}
.qopts input:hover+span{border-color:var(--muted)}
.qopts input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.qopts input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
@media (max-width:760px){.res{grid-template-columns:minmax(0,1fr)}}
.radar{width:100%;max-width:380px;margin-inline:auto;color:var(--fg)}
.radar .grid-l{fill:none;stroke:var(--line);stroke-width:1}
.radar .shape{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:2.5}
.radar text{fill:var(--muted);font:600 11px var(--font-body)}
.big{font-family:var(--font-head);font-size:clamp(3rem,7vw,5rem);font-weight:800;line-height:1;letter-spacing:-.04em}
.big small{font-size:.35em;color:var(--muted);font-weight:600}
.lvl{display:inline-block;margin:10px 0 18px;padding:5px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 .8rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.dims{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
.dims li{display:grid;grid-template-columns:130px 1fr 38px;gap:10px;align-items:center;font-size:.9rem}
.dims .bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden}
.dims .bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.rec{padding:16px 18px;border-left:3px solid var(--accent);background:var(--chip);border-radius:0 12px 12px 0;margin-bottom:20px}
.rec b{display:block;margin-bottom:4px}
.rec span{color:var(--muted);font-size:.95rem}

/* voices */
.voices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2vw,24px)}
@media (max-width:820px){.voices{grid-template-columns:minmax(0,1fr)}}
.voice{margin:0;display:flex;flex-direction:column;gap:20px;justify-content:space-between}
.voice blockquote{margin:0;font-size:1.08rem;line-height:1.6}
.voice blockquote::before{content:"“";display:block;font-family:var(--font-head);font-size:3.5rem;line-height:.6;color:var(--accent);margin-bottom:10px}
.voice figcaption{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}
.voice figcaption i{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 .75rem var(--font-mono);font-style:normal}

/* faq */
.faq{max-width:900px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:22px 0;display:flex;justify-content:space-between;gap:20px;align-items:center;font-family:var(--font-head);font-size:clamp(1.1rem,2vw,1.35rem);font-weight:600;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.8rem;font-weight:300;color:var(--accent-text);transition:transform .25s;line-height:1}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 24px;color:var(--muted);max-width:68ch;margin:0}

/* contact */
.contact{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,5vw,72px);align-items:start}
@media (max-width:900px){.contact{grid-template-columns:minmax(0,1fr)}}
.contact .side h3{margin-bottom:10px}
.contact .side p{color:var(--muted)}
.mail{font-family:var(--font-head);font-size:clamp(1.2rem,2.4vw,1.7rem);font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:2px;word-break:break-all}
form.cf{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){form.cf{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:.85rem;font-weight:600}
.fld label small{color:var(--muted);font-weight:400}
.fld input,.fld textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:100%;transition:border-color .2s,box-shadow .2s}
.fld textarea{min-height:140px;resize:vertical}
.fld input:hover,.fld textarea:hover{border-color:var(--muted)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.fld [aria-invalid="true"]{border-color:var(--err)}
.err{color:var(--err);font-size:.85rem;min-height:1.2em;display:block}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:.92rem}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.chk a{text-decoration:underline}
.fsum{grid-column:1/-1;padding:12px 16px;border:1px solid var(--err);border-radius:12px;color:var(--err);font-size:.92rem}
.fsum[hidden]{display:none}
.ok{padding:clamp(24px,4vw,40px);border:1px solid var(--accent);border-radius:var(--radius);background:var(--surface)}
.ok[hidden],form.cf[hidden]{display:none}
.ok h3{margin-bottom:10px}
.ok p{color:var(--muted)}
.ok .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}

/* footer */
.foot{border-top:1px solid var(--line);padding-block:clamp(40px,6vw,72px) 32px;background:var(--bg2)}
.foot-g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;margin-bottom:36px}
@media (max-width:760px){.foot-g{grid-template-columns:minmax(0,1fr)}}
.foot p{color:var(--muted);font-size:.92rem;margin:0 0 6px}
.foot h4{font:600 .75rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);margin-bottom:14px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot a{text-decoration:none;color:var(--muted);font-size:.95rem}
.foot a:hover{color:var(--fg);text-decoration:underline}
.legal-line{border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}

/* cookie notice */
.cookie{position:fixed;right:clamp(12px,3vw,28px);bottom:clamp(12px,3vw,28px);max-width:360px;z-index:110;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);font-size:.9rem}
.cookie[hidden]{display:none}
.cookie b{display:block;margin-bottom:6px;font-family:var(--font-head)}

2" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button><button type="button" class="ibtn menu-btn" aria-expanded="false" aria-controls="nav" data-open="Menü megnyitása" data-close="Menü bezárása" aria-label="Menü megnyitása"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></div></header><main id="main" tabindex="-1"><section class="hero" id="top"><canvas id="net" aria-hidden="true"></canvas><div class="wrap"><p class="eyebrow rv">Vezetői képességfejlesztés · digitális transzformáció</p><h1 class="rv" style="--d:1">Vezetők, akik <em>beszélik</em> a digitális nyelvet.</h1><p class="lead rv" style="--d:2">A SynaptiQ hidat épít az IT és az üzlet között. Vezetőképzéssel és 1:1 mentorálással segítünk, hogy a döntéshozók az egész digitális képet lássák, és szervezetük jövőállóvá váljon.</p><div class="rv" style="--d:3"><div class="actions"><a class="btn" href="#products">Termékeink<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="btn ghost" href="#check">Digitális önteszt (3 perc)</a></div></div><ul class="chips rv" style="--d:4"><li>Közös nyelv</li><li>Tisztán látó döntés</li><li>Nem csak AI</li></ul><p class="motto">From Synapse to Strategy</p></div></section><section class="sec" id="about"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Alapgondolat</p><span class="formula">SynaptiQ = Synapsis + IQ</span><h2>Ha a vezetők digitális képessége erősödik, a szervezet digitális intelligenciája is erősödik.</h2><p class="lead">Minden stratégiai változás egy kapcsolattal, egy szinapszissal kezdődik. A valódi versenyelőny ott születik, ahol az üzleti belátás, a vezetői képesség és az innováció egyetlen, következetes cselekvéssé áll össze.</p></div><div class="grid g3"><div class="card mvv rv" style="--d:0"><h3>Küldetésünk</h3><p>Vezetők digitális szemléletét és képességét fejlesztjük, hogy az IT és az üzlet egy nyelven beszéljen, és szervezetük tudatosan, a hype helyett a tényekre építve döntsön.</p></div><div class="card mvv rv" style="--d:1"><h3>Jövőképünk</h3><p>Olyan szervezetek közössége, amelyeket az egész digitális képet látó, jó kérdéseket feltevő vezetők irányítanak, és a technológiát tartós előnnyé fordítják.</p></div><div class="card mvv rv" style="--d:2"><h3>Elvünk</h3><p>Nem megoldásokat adunk, hanem rálátást. Nem azt mondjuk meg, mit tegyen, hanem segítünk jobb kérdéseket feltenni.</p></div></div><div class="card eagle-note rv"><svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 44L60 14l54 30"/><path d="M18 58L60 34l42 24"/><path d="M32 72L60 56l28 16"/><path d="M60 78v10"/><path d="M55 40l5 8 5-8z" fill="currentColor"/></svg><div><h3>Miért a sas?</h3><p>Felülről látja az egész képet, mégis észreveszi a részleteket. Gyorsan mozog, határozottan dönt, és a legjobb megoldásra csap le. Ezt a vezetői szemléletet fejlesztjük.</p></div></div></div></section><section class="sec alt" id="bridge"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Az IT–üzlet híd</p><h2>Ugyanarról beszélnek, mégsem értik egymást.</h2><p class=lead>A digitális átalakítás ott akad el, ahol az üzleti és az IT vezetők nem beszélnek közös nyelvet. Próbáld ki: koppints egy mondatra, és nézd meg, mit hall belőle a másik oldal, és mi a közös nyelv.</p></div><div class="xl"><button type="button" class="xc rv" style="--d:0" data-from="b" aria-pressed="false"><span class="who">Az üzlet mondja</span><span class="say">“Jövő negyedévre kell.”</span><span class="hear"><small>Az IT ezt hallja</small>Hagyjuk ki a tesztelést és a biztonságot.</span><span class="com"><small>Közös nyelven</small>Határozzuk meg a minimális hasznos hatókört és a kihagyhatatlan kontrollokat.</span><span class="tap">Koppints a kártyára <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:1" data-from="b" aria-pressed="false"><span class="who">Az üzlet mondja</span><span class="say">“Tegyünk bele valami AI-t.”</span><span class="hear"><small>Az IT ezt hallja</small>Nincs adat, nincs folyamat, nincs felelős.</span><span class="com"><small>Közös nyelven</small>Melyik döntés vagy folyamat javul, melyik KPI-on mérve, milyen adatból?</span><span class="tap">Koppints a kártyára <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:2" data-from="i" aria-pressed="false"><span class="who">Az IT mondja</span><span class="say">“Az adatminőség miatt újra kell tanítani a modellt.”</span><span class="hear"><small>Az üzlet ezt hallja</small>Még több költség, még mindig nincs eredmény.</span><span class="com"><small>Közös nyelven</small>Az adatminőség dönti el a megbízhatóságot, és ezzel az üzleti értéket.</span><span class="tap">Koppints a kártyára <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:0" data-from="i" aria-pressed="false"><span class="who">Az IT mondja</span><span class="say">“Technikai adósságunk van.”</span><span class="hear"><small>Az üzlet ezt hallja</small>Kifogás, hogy miért lassú az IT.</span><span class="com"><small>Közös nyelven</small>Korábbi rövidítések, amelyek minden jövőbeli változást lassabbá és drágábbá tesznek.</span><span class="tap">Koppints a kártyára <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:1" data-from="b" aria-pressed="false"><span class="who">Az üzlet mondja</span><span class="say">“Építsük meg az üzletben, low-code-dal.”</span><span class="hear"><small>Az IT ezt hallja</small>Árnyék-IT, kontroll nélkül.</span><span class="com"><small>Közös nyelven</small>Szabályozott digitális eszközhasználat: világos keretek, megosztott felelősség.</span><span class="tap">Koppints a kártyára <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button><button type="button" class="xc rv" style="--d:2" data-from="i" aria-pressed="false"><span class="who">Az IT mondja</span><span class="say">“A token- és inferenciaköltség miatt másik modell kell.”</span><span class="hear"><small>Az üzlet ezt hallja</small>Szakzsargon.</span><span class="com"><small>Közös nyelven</small>Minden AI-válasznak ára van, és ez dönti el, melyik modell melyik feladatra való.</span><span class="tap">Koppints a kártyára <svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div></div></section><section class="sec" id="stats"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Számokban</p><h2>A stratégia a vezetésen keresztül válik valósággá.</h2><p class=lead>A SynaptiQ az emberi intelligenciát stratégiai hatássá alakítja: tisztánlátást, tudást és magabiztosságot ad a digitális változás vezetéséhez.</p></div><div class="stats"><div class="stat rv" style="--d:0"><div class="num"><span data-count="500">500</span><sup>+</sup></div><p>vezető vett részt programjainkon</p></div><div class="stat rv" style="--d:1"><div class="num"><span data-count="10">10</span><sup>+</sup></div><p>országban dolgoztunk</p></div><div class="stat rv" style="--d:2"><div class="num"><span data-count="4">4</span></div><p>tapasztalt felsővezetői tréner</p></div><div class="stat rv" style="--d:3"><div class="num"><span data-count="70">70</span><sup>%</sup></div><p>gyakorlat, 30% elmélet</p></div></div></div></section><section class="sec alt" id="products"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Termékeink</p><h2>Egy összefüggő vezetői út, amelyet cégre szabunk.</h2><p class=lead>Az Eagle Journey megalapozza a digitális rálátást, az Eagle Next három egymásra épülő modulja pedig a saját szervezeted konkrét kérdéseire ad választ. Külön-külön és sorban is elvégezhetők.</p></div><div class="tabs" role="tablist"><button class="tab" role="tab" id="tab-0" aria-controls="pnl-0" aria-selected="true" tabindex="0" type="button">Eagle Journey</button><button class="tab" role="tab" id="tab-1" aria-controls="pnl-1" aria-selected="false" tabindex="-1" type="button">Eagle Next</button><button class="tab" role="tab" id="tab-2" aria-controls="pnl-2" aria-selected="false" tabindex="-1" type="button">Mentorálás és tanácsadás</button></div><div class="panel" role="tabpanel" id="pnl-0" aria-labelledby="tab-0"><div class="prod-top"><div><h3>Eagle Journey</h3><p class="tag">„Értem a digitális tájat”</p><p>Kétnapos, gyakorlatorientált vezetői program. Közös nyelvet teremt az IT és az üzlet között, és olyan „aha” pillanatokat ad, amelyekből a vezetők a saját szervezetükre vonatkozó döntéseket építik.</p><ul class="facts"><li><b>Kinek szól</b><span>Középvállalati és annál nagyobb szervezetek felsővezetői és csapatvezetői, iparágtól és előképzettségtől függetlenül. Nem IT-vezetőknek készült, hanem az üzleti vezetők digitális vezetővé válásához.</span></li><li><b>Forma</b><span>2 nap, interaktív workshopok, élő demók, saját esetek. A tananyag negyedévente frissül.</span></li><li><b>Kézzelfogható eredmény</b><span>Saját akcióterv, Value Generation Canvas, közös fogalomkészlet.</span></li></ul></div><div class="art" aria-hidden="true"><svg viewBox="0 0 400 300" fill="none" aria-hidden="true"><g stroke="var(--line)" stroke-width="1"><path d="M0 60H400"/><path d="M0 120H400"/><path d="M0 180H400"/><path d="M0 240H400"/></g><polyline points="30,210 66,181 102,176 138,147 174,142 210,113 246,108 282,79 318,74 354,45" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/><circle cx="30" cy="210" r="5" fill="currentColor"/><circle cx="66" cy="181" r="5" fill="currentColor"/><circle cx="102" cy="176" r="5" fill="currentColor"/><circle cx="138" cy="147" r="5" fill="currentColor"/><circle cx="174" cy="142" r="5" fill="currentColor"/><circle cx="210" cy="113" r="5" fill="currentColor"/><circle cx="246" cy="108" r="5" fill="currentColor"/><circle cx="282" cy="79" r="5" fill="currentColor"/><circle cx="318" cy="74" r="5" fill="currentColor"/><circle cx="354" cy="45" r="8" fill="var(--accent2,currentColor)"/><g transform="translate(250 30) scale(.8)" stroke="var(--fg)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"><path d="M6 44L60 14l54 30"/><path d="M18 58L60 34l42 24"/><path d="M32 72L60 56l28 16"/><path d="M60 78v10"/></g></svg></div></div><div class="days"><div class="card"><h4>1. nap · Gyakorlati AI-eszközök, agentic AI, use case-ek</h4><ul class="ticks"><li>Value Generation Canvas: konkrét eszköz a saját érték feltárásához</li><li>Új trendek és AI-eszközök, élő demók</li><li>Mitől jó egy AI use case, és hol csúsznak el az átállások</li><li>AI EU Act: a legfrissebb szabályozási keretek</li><li>Agentic AI saját és közös gyakorlatokon át</li></ul></div><div class="card"><h4>2. nap · Cloud, FinOps, digital tooling, digitális vezetés</h4><ul class="ticks"><li>FinOps for AI: token-alapú elszámolás, SLM és on-premise AI</li><li>Digital tooling (LCNC) és kiváltási mátrix</li><li>Business–IT együttműködés az AI korában</li><li>Kritikus gondolkodás és hallucináció</li><li>Egyéni és szervezeti akcióterv a záró blokkban</li></ul></div></div><div class="mods"><h4>Az Eagle Journey 10 modulja</h4><ul class="modlist"><li>Eagle Introduction</li><li>Data &amp; AI Mindset</li><li>AI Focus Blocks</li><li>Cloud for Executives</li><li>Low-Code / No-Code</li><li>Value Generation</li><li>Technical Teams</li><li>Data Enablement</li><li>Digital Org</li><li>Knowledge Test</li></ul></div></div><div class="panel" role="tabpanel" id="pnl-1" aria-labelledby="tab-1" hidden><div class="prod-top"><div><span class="badge">Új · 2026</span><h3>Eagle Next</h3><p class="tag">Gyakorlati vezetői út az alapozás után</p><p>Három egymásra épülő tréning egy összefüggő vezetői úton. Blended forma: e-learning, use case előfeladat és workshop. Minden vezető a saját kezdeményezésén dolgozik, és akciótervvel távozik.</p></div><div class="art" aria-hidden="true"><svg viewBox="0 0 400 300" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="24" y="70" width="104" height="150" rx="10" fill="var(--surface2)"/><rect x="148" y="70" width="104" height="150" rx="10" fill="var(--surface2)"/><rect x="272" y="70" width="104" height="150" rx="10" fill="var(--surface2)"/></g><g stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><path d="M42 106h68M42 128h52M42 150h60M166 106h68M166 128h40M166 150h62M290 106h68M290 128h56M290 150h44"/></g><g fill="currentColor"><circle cx="76" cy="194" r="9"/><circle cx="200" cy="194" r="9"/><circle cx="324" cy="194" r="9"/></g><g stroke="var(--accent2,currentColor)" stroke-width="3" stroke-linecap="round"><path d="M132 245h16M256 245h16"/><path d="M144 238l8 7-8 7M268 238l8 7-8 7"/></g></svg></div></div><h4 class="sr">A három lépés</h4><div class="flow"><button type="button" class="fl" aria-pressed="true"><span class="n">01</span><span class="k">STRATEGY → VALUE</span><span class="t">Digital Strategy to Action</span><span class="w">WHY</span></button><button type="button" class="fl" aria-pressed="false"><span class="n">02</span><span class="k">VALUE → DELIVERY</span><span class="t">Bank-Ready Delivery</span><span class="w">HOW</span></button><button type="button" class="fl" aria-pressed="false"><span class="n">03</span><span class="k">AI → NEXT</span><span class="t">From Gen AI to Agentic AI</span><span class="w">WHAT&#x27;S NEXT</span></button></div><div class="card mdetail"><div><p class="eyebrow">Vezetői kérdés</p><p class="qq">Mely digitális kezdeményezések viszik közelebb a szervezetet a mérhető céljaihoz?</p><ul class="facts"><li><b>Forma</b><span>60–90 perc e-learning, majd 1 napos workshop saját célon, társak visszajelzésével.</span></li><li><b>Kézzelfogható eredmény</b><span>Digital Initiative Canvas és 6–12 hónapos Initiative Portfolio.</span></li></ul></div><ol class="steps5"><li>Stratégiai célból mérhető eredmény</li><li>Az eredménytől a hiányzó képességig</li><li>A képességtől a technológiai igényig</li><li>A kezdeményezési portfólióig</li><li>Saját cél végigvitele a modellen</li></ol></div><div class="card mdetail" hidden><div><p class="eyebrow">Vezetői kérdés</p><p class="qq">Hogyan induljon el egy digitális ötlet szabályozott környezetben megvalósítható módon, kevesebb újratervezéssel?</p><ul class="facts"><li><b>Forma</b><span>90–120 perc e-learning és 1 napos governance workshop saját projekttel, szerepjátékkal.</span></li><li><b>Kézzelfogható eredmény</b><span>Bank-Ready Project Canvas, governance és readiness checklist, stakeholder map.</span></li></ul></div><ol class="steps5"><li>Miért akadnak el a jó projektek? Reuse before build</li><li>Know your data before design</li><li>A megfelelő megvalósítási út kiválasztása</li><li>Felelősség, életciklus, pilot</li><li>Bank-ready projekt workshop</li></ol></div><div class="card mdetail" hidden><div><p class="eyebrow">Vezetői kérdés</p><p class="qq">Hol teremt értéket az AI új hulláma, és milyen feltételekkel érdemes bevezetni?</p><ul class="facts"><li><b>Forma</b><span>45–60 perc e-learning, élő ágensdemó, megbízhatósági gyakorlat és saját AI use case.</span></li><li><b>Kézzelfogható eredmény</b><span>AI Opportunity &amp; Readiness Canvas és vezetői akcióterv.</span></li></ul></div><ol class="steps5"><li>AI-lehetőség a saját folyamatban</li><li>Üzleti érték, mérhető sikermutatóval</li><li>Agentic AI: demó és valóság, enterprise readiness</li><li>Human AI literacy: kritikus gondolkodás</li><li>AI economics: melyik modell melyik feladatra</li></ol></div></div><div class="panel" role="tabpanel" id="pnl-2" aria-labelledby="tab-2" hidden><div class="prod-top"><div><h3>Mentorálás és tanácsadás</h3><p class="tag">1:1 és cégre szabva</p><p>A programokat a szervezetre szabjuk, és 1:1 mentorálással, tanácsadással egészítjük ki. Közösen felmérjük, hol tart most a szervezet, és hová szeretne eljutni.</p></div><div class="art" aria-hidden="true"><svg viewBox="0 0 400 300" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.4"><circle cx="110" cy="150" r="58" fill="var(--surface2)"/><circle cx="290" cy="150" r="58" fill="var(--surface2)"/></g><path d="M168 150h64" stroke="var(--accent2,currentColor)" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g fill="currentColor"><circle cx="110" cy="134" r="14"/><path d="M82 184c4-18 52-18 56 0z"/><circle cx="290" cy="134" r="14"/><path d="M262 184c4-18 52-18 56 0z"/></g></svg></div></div><div class="adv" style="margin-top:0"><div class="card"><h4>Képességfelmérés</h4><p>Közös felmérés a transzformatív digitális képességek jelenlegi és célszintjéről.</p></div><div class="card"><h4>Cégre szabott program</h4><p>A saját működési valóságotokból vett esetek és dilemmák, nem egy ideális szervezet példái.</p></div><div class="card"><h4>1:1 vezetői mentorálás</h4><p>Személyes támogatás az akcióterv megvalósításához és a csapat vezetéséhez.</p></div><div class="card"><h4>Stratégiai tanácsadás</h4><p>Kezdeményezési portfólió, megvalósíthatóság, kontrollok és szabályozási megfelelés.</p></div></div></div><p class="portfolio">Az Eagle Journey a Pulze Digital vezetői képességfejlesztő portfóliójának része. Nem önálló tanfolyam, hanem rendszer.</p></div></section><section class="sec" id="method"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Módszertan</p><h2>A képességfelméréstől a tartós változásig.</h2><p class=lead>A tanulási utat olyan szakértők vezetik, akik nem csak tanítják, hanem valós üzleti környezetben alkalmazzák is ezeket a képességeket. A megközelítés fókuszált, gyakorlatias és vezetői szemléletű.</p></div><div class="msteps"><div class="ms rv" style="--d:0"><h3>Felmérés</h3><p>Közösen megnézzük, hol tart a szervezet, és hová szeretne eljutni.</p></div><div class="ms rv" style="--d:1"><h3>Tanulás</h3><p>Vezetőknek szóló tudás és gyakorlat, 70% gyakorlattal, 30% elmélettel.</p></div><div class="ms rv" style="--d:2"><h3>Alkalmazás</h3><p>Saját esetek és dilemmák, a döntésekre való közvetlen átültetéssel.</p></div><div class="ms rv" style="--d:3"><h3>Fenntartás</h3><p>Akcióterv, mentorálás, negyedéves tartalomfrissítés.</p></div></div><div class="ska rv"><div><h3>SKA-módszertan</h3><p>A Skill, Knowledge és Attitude az egész programon végigfut, hogy a tanulás ne egyszeri tudásátadás legyen, hanem tartós képesség- és szemléletváltás.</p></div><div class="tri"><div><strong>Skill</strong><span>Képesség</span></div><div><strong>Knowledge</strong><span>Tudás</span></div><div><strong>Attitude</strong><span>Attitűd</span></div></div></div><h3 class="trh rv">Akik vezetik: volt felsővezetők</h3><div class="grid g3"><div class="card tr rv" style="--d:0"><h3>Már ültek a döntéshozói székben</h3><p>Értik a döntési dilemmákat, a nyomást és a bizonytalanságot, ezért hitelesek az üzleti és a digitális oldalról érkező vezetőknek is.</p></div><div class="card tr rv" style="--d:1"><h3>Négyfős szakértői közösség</h3><p>A trénerek folyamatosan megosztják a tudásukat és a terepi tapasztalatokat, nem magányos oktatók.</p></div><div class="card tr rv" style="--d:2"><h3>Mindig naprakész</h3><p>Negyedéves felülvizsgálat, a piaci és technológiai kutatás és a terepi tapasztalat alapján.</p></div></div></div></section><section class="sec alt" id="check"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Digitális önteszt</p><h2>Mennyire felkészült a vezetői csapatod?</h2><p class=lead>Nyolc kérdés, három perc. Az eredmény négy dimenzióban mutatja meg, hol erős a szervezet, és melyik programunk illik hozzá. Az adatok nem hagyják el a böngésződet.</p></div><div class="quiz rv" id="quiz"><div class="qbox" id="quiz-body" aria-live="polite"></div></div><script type="application/json" id="quiz-data">{"q": ["A digitális kezdeményezéseink mérhető üzleti célhoz, KPI-hoz kötődnek.", "A vezetői csapat közös képet lát arról, hol teremt valódi értéket az AI és a digitális technológia.", "Tudjuk, mely adatainkban bízhatunk, és van felelőse az adatminőségnek.", "A vezetőink el tudják dönteni, mikor elég egy chatbot, automatizáció vagy AI-ágens.", "Az ötletektől a működésig tisztán látjuk a felelősöket, kontrollokat és az életciklust.", "Az üzleti és az IT oldal ugyanazokat a fogalmakat használja, ha egy projektről beszél.", "A kollégák biztonságosan, szabályozott keretek között építhetnek saját digitális megoldásokat.", "A vezetők tudják motiválni a csapatot, és látják, kit milyen szintre érdemes fejleszteni."], "dimOf": [0, 0, 1, 1, 2, 2, 3, 3], "dims": ["strategy", "data", "delivery", "people"], "dimNames": {"strategy": "Stratégia és érték", "data": "Adat és AI", "delivery": "Megvalósítás", "people": "Emberek és kultúra"}, "scale": ["Egyáltalán nem", "Részben", "Nagyrészt", "Teljesen"], "qof": "kérdés", "next": "Tovább", "prev": "Vissza", "see": "Eredmény megtekintése", "restart": "Újrakezdés", "levels": ["Kezdő", "Fejlődő", "Haladó", "Élenjáró"], "recs": {"strategy": ["Eagle Next 01 · Digital Strategy to Action", "Segít a szervezeti célból mérhető, priorizált kezdeményezési portfóliót építeni."], "data": ["Eagle Journey · Data & AI Mindset", "Megalapozza az adat- és AI-tudatos vezetői döntéseket, és közös nyelvet ad."], "delivery": ["Eagle Next 02 · Bank-Ready Delivery", "Megmutatja, hogyan jusson el egy ötlet a kontrollált, működő megvalósításig."], "people": ["Eagle Journey · Digital Leadership", "A vezetői szerepre, a csapat motiválására és a kultúraváltásra fókuszál."]}, "resultT": "Az eredményed", "lowest": "Legnagyobb fejlődési terület", "cta": "Beszéljük meg az eredményt", "msg": "Kitöltöttem a digitális önteszteket. Eredmény: {score}/100, legnagyobb fejlődési terület: {dim}. Szívesen beszélnék a lehetőségekről."}</script></div></section><section class="sec" id="voices"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Visszajelzések</p><h2>Vezetői reflexiók a teremből.</h2><p class=lead>Valódi résztvevői visszajelzések a programból.</p></div><div class="voices"><figure class="card voice rv" style="--d:0"><blockquote>Nagyon értékes volt, hogy a mindennapi munkámban használható eszközökkel távoztam, a vártnál nagyobb mélységgel. Világosan látom, hová vihetem a csapatomat vezetőként, és olyan tudást is kaptam, amit a magánéletben is használhatok.</blockquote><figcaption><i>SQ</i>Felsővezetői résztvevő</figcaption></figure><figure class="card voice rv" style="--d:1"><blockquote>Kiváló volt a tempó, és valódi fogalmi szerkezetet adott a témához. Az első nap otthon azonnal építettem valamit, ami lenyűgözte a feleségemet. A második napra ő köszöntött azzal, amit az előző este mutatott AI-eszközökkel készített. Inspiráló.</blockquote><figcaption><i>SQ</i>Üzletági vezető</figcaption></figure><figure class="card voice rv" style="--d:0"><blockquote>Olyan ajtókat nyitott ki, amelyeket eddig csak távolról néztem.</blockquote><figcaption><i>SQ</i>Funkcióvezető</figcaption></figure><figure class="card voice rv" style="--d:1"><blockquote>Őszintén élveztem, tágította a látókörömet. Kiváló volt a csoport, jó volt ilyen emberekkel találkozni. Még most is emésztem az eszközöket. Az első nap végére már a kollégáimnak mondtam, hogy jelentkezzenek, a főnökömnek is ajánlottam.</blockquote><figcaption><i>SQ</i>Transzformációs vezető</figcaption></figure></div></div></section><section class="sec alt" id="faq"><div class="wrap"><div class="sec-head rv"><p class="eyebrow">Gyakori kérdések</p><h2>Amit a vezetők leggyakrabban kérdeznek.</h2></div><div class="faq rv"><details><summary>Kinek szól az Eagle Journey?</summary><p>Középvállalati és annál nagyobb szervezetek felső- és csapatvezetőinek, iparágtól és előképzettségtől függetlenül. Nem IT-vezetőknek készült, hanem az üzleti vezetők digitális vezetővé válásához, miközben hidat épít az IT felé.</p></details><details><summary>Csak az AI-ról szól?</summary><p>Nem. Az AI fontos mérföldkő, de a teljes digitális képet tárgyaljuk: adat, cloud és FinOps, digital tooling (LCNC), szabályozás, szervezet és vezetői kultúra. Mindenki az AI-t nyomja, mi a szélesebb látókört adjuk.</p></details><details><summary>Mennyi ideig tart?</summary><p>Az Eagle Journey két nap. Az Eagle Next három moduljához e-learning és egy-egy workshopnap tartozik; a modulok külön-külön és sorban is elvégezhetők.</p></details><details><summary>Szabható a program a cégünkre?</summary><p>Igen. Minden programot a cég saját esetei, dilemmái és működési valósága köré szabunk, és 1:1 mentorálással, tanácsadással egészítjük ki.</p></details><details><summary>Hogyan marad naprakész a tananyag?</summary><p>Negyedéves felülvizsgálati ciklusban frissítjük: a piaci és technológiai kutatás, valamint a trénerközösség terepi tapasztalata alapján.</p></details><details><summary>Mivel távoznak a résztvevők?</summary><p>Közös fogalomkészlettel, saját akciótervvel és konkrét eszközökkel (például Value Generation Canvas), amelyeket másnap használni tudnak.</p></details></div></div></section><section class="sec" id="contact"><div class="wrap"><div class="contact"><div class="side rv"><p class="eyebrow">Kapcsolat</p><h2>Minden együttműködés egy beszélgetéssel indul.</h2><p class="lead" style="margin-top:18px">Írd meg néhány mondatban a szervezetedet, a vezetőfejlesztési céljaidat és a jelenlegi kihívásaidat.</p><h3 style="font-size:1rem;margin:30px 0 8px">Elérhetőség</h3><a class="mail" href="mailto:info@synaptiq.hu">info@synaptiq.hu</a><p style="margin-top:14px">Vezetőfejlesztési egyeztetésekhez, képzési megkeresésekhez és tanácsadási beszélgetésekhez.</p></div><div class="rv" style="--d:1"><form class="cf" id="cf" novalidate><div class="fsum" id="cf-sum" role="alert" hidden>Kérjük, javítsd a megjelölt mezőket.</div><div class="fld"><label for="f-name">Név</label><input id="f-name" name="f-name" type="text" required aria-required="true" aria-describedby="f-name-e" autocomplete="name"><span class="err" id="f-name-e" data-msg="Kérjük, add meg a neved." role="alert"></span></div><div class="fld"><label for="f-email">E-mail</label><input id="f-email" name="f-email" type="email" required aria-required="true" aria-describedby="f-email-e" autocomplete="email"><span class="err" id="f-email-e" data-msg="Kérjük, adj meg érvényes e-mail-címet." role="alert"></span></div><div class="fld"><label for="f-company">Cég <small>(opcionális)</small></label><input id="f-company" name="f-company" type="text" autocomplete="organization"></div><div class="fld"><label for="f-role">Beosztás <small>(opcionális)</small></label><input id="f-role" name="f-role" type="text" autocomplete="organization-title"></div><div class="fld full"><labe
